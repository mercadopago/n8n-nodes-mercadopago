name: CI

# Validates every PR (and direct pushes to protected branches) by running
# the full pipeline: install → lint → build → tests with coverage.
# Gives us a hard guarantee that no change lands on master/develop without
# passing the same checks the published package goes through.

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]

# Cancel previous in-progress runs for the same PR/branch when a new commit
# arrives — saves runner time and surfaces only the latest result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧹 Lint
        run: npm run lint

      - name: 🏗️ Build
        run: npm run build

      - name: 🧪 Tests with coverage
        run: npm run test:coverage

      - name: 📊 Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
