name: Publish to npm

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Force public npm registry in case .npmrc has any other configured
      - name: Configure npm registry
        run: npm config set registry https://registry.npmjs.org/

      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - run: npm run lint

      # Inject the real Platform ID into the compiled dist before publishing
      - name: Inject Platform ID
        run: sed -i "s/'platform-id'/'${{ secrets.X_PLATFORM_ID }}'/g" dist/constants.js

      # Skip prepublishOnly to avoid re-running build which overwrites the sed above
      - run: npm publish --ignore-scripts
