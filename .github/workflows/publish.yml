name: Publish to npm

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Override *** registry from .npmrc so CI uses npmjs.org
      - name: Configure npm registry
        run: npm config set registry https://registry.npmjs.org/

      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - run: npm run lint

      # Inject the real Platform ID into the compiled dist before publishing
      - name: Inject Platform ID
        run: sed -i "s/'platform-id'/'${{ secrets.X_PLATFORM_ID }}'/g" dist/constants.js

      # Skip prepublishOnly to avoid re-running build which overwrites the sed above
      # --provenance is required by n8n verified nodes (cryptographic build attestation)
      - run: npm publish --ignore-scripts --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
