name: Publish to npm
description: Publishes the package to npm when a release is published on GitHub.
permissions: {}

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read # To read files in the repository.
      id-token: write # To request OpenID Connect tokens for signing the provenance of the build.

    environment: release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Override *** registry from .npmrc so CI uses npmjs.org
      - name: Configure npm registry
        run: npm config set registry https://registry.npmjs.org/

      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - run: npm run lint

      # Inject the real Platform ID into the compiled dist before publishing
      - name: Inject Platform ID
        run: sed -i "s/'platform-id'/'${X_PLATFORM_ID}'/g" dist/constants.js
        env:
          X_PLATFORM_ID: ${{ secrets.X_PLATFORM_ID }}

      # Skip prepublishOnly to avoid re-running build which overwrites the sed above
      # --provenance is required by n8n verified nodes (cryptographic build attestation)
      - run: npm publish --ignore-scripts --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

concurrency:
  group: publish
  cancel-in-progress: true
